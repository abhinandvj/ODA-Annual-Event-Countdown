<title>ODA 7th Annual Event – Countdown</title>
<meta name="description" content="The countdown is on! Join the ODA 7th Annual Event on 24 November at 8:00 PM IST.">
<style>
:root{color-scheme:dark;--gold:#ffda8a;--pink:#ff79cf;--violet:#b99aff;--ink:#160b35}
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 8%,#633a9c 0,#32165f 36%,#160b35 75%,#0b0820 100%);display:grid;place-items:center;padding:28px 16px}
body:before,body:after{content:"";position:fixed;width:min(90vw,700px);aspect-ratio:1;border:1px solid #f5d59b24;border-radius:50%;pointer-events:none;animation:orbit 24s linear infinite}body:after{width:min(120vw,950px);animation-direction:reverse;opacity:.5}
@keyframes orbit{to{transform:rotate(360deg)}}
.wrap{width:min(760px,100%);position:relative;z-index:1;text-align:center;padding:clamp(25px,5vw,48px);border:1px solid #ffdc8c70;border-radius:32px;background:linear-gradient(145deg,#ffffff16,#ffffff08);box-shadow:0 25px 90px #0007;backdrop-filter:blur(12px)}
.logo{display:block;width:150px;max-width:45%;height:auto;margin:0 auto 20px;filter:drop-shadow(0 7px 18px #0005)}
.kicker{font-size:12px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(31px,7vw,56px);line-height:1.03;letter-spacing:-.045em;margin:12px 0 10px}h1 span{background:linear-gradient(90deg,#ffe7a5,#ff91cf,#b7a1ff);background-clip:text;color:transparent}
.sub{color:#e4d8f6;font-size:clamp(14px,2.5vw,18px);margin:0 auto 26px;line-height:1.5}
.upgrade{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1px solid #ffda8a8a;border-radius:999px;background:linear-gradient(100deg,#ffda8a20,#ff79cf20);color:#ffe6ae;font-weight:950;letter-spacing:.06em;font-size:clamp(12px,2.5vw,15px);margin-bottom:28px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 auto 26px}.unit{padding:18px 8px 14px;border:1px solid #ffffff2e;border-radius:18px;background:#1009279c;box-shadow:inset 0 1px #ffffff10}.num{display:block;font-variant-numeric:tabular-nums;font-size:clamp(34px,8vw,62px);font-weight:950;line-height:1;color:#fff0c6;text-shadow:0 0 24px #ffcf7770}.label{display:block;margin-top:9px;color:#cbbbe7;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.date{font-size:clamp(15px,3vw,19px);font-weight:850;color:#fff;margin:4px 0 24px}.date span{color:var(--gold)}
.cta{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:54px;padding:15px 28px;border-radius:999px;text-decoration:none;color:#25123f;font-weight:950;background:linear-gradient(110deg,#ffe7a2,#ffb8d9 55%,#c7b2ff);box-shadow:0 12px 35px #b18aff40;transition:transform .2s,box-shadow .2s}.cta:hover{transform:translateY(-3px);box-shadow:0 16px 42px #b18aff65}.foot{margin-top:22px;color:#cbbde0;font-size:12px}
@media(max-width:430px){.wrap{padding:28px 16px;border-radius:25px}.timer{gap:7px}.unit{padding:15px 4px 12px;border-radius:14px}.label{font-size:9px;letter-spacing:.1em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.oda-brandline{display:flex;justify-content:center;align-items:baseline;gap:7px;margin:-13px auto 20px;font-weight:950;font-size:23px;letter-spacing:.02em;text-shadow:0 2px 12px #0005}
.oda-brandline span{color:#26c5d0}.oda-brandline b{color:#ff68b6;font-size:.92em}
.unit{perspective:700px;overflow:hidden}
.num{transform-origin:50% 55%;will-change:transform,opacity}
.num.flip{animation:numberFlip .42s cubic-bezier(.2,.75,.25,1)}
@keyframes numberFlip{0%{transform:rotateX(0) translateY(0);opacity:1;filter:brightness(1)}45%{transform:rotateX(-78deg) translateY(-5px);opacity:.15;filter:brightness(1.7)}55%{transform:rotateX(78deg) translateY(5px);opacity:.15}100%{transform:rotateX(0) translateY(0);opacity:1;filter:brightness(1.25)}}
.unit.tick{animation:unitGlow .45s ease-out}
@keyframes unitGlow{0%{box-shadow:inset 0 1px #ffffff10,0 0 0 #d5a5ff00}45%{box-shadow:inset 0 1px #ffffff20,0 0 25px #d5a5ff88}100%{box-shadow:inset 0 1px #ffffff10,0 0 0 #d5a5ff00}}
@media(prefers-reduced-motion:reduce){.num.flip,.unit.tick{animation:none}}

</style>

<script>
// 24 November 2026, 8:00 PM India Standard Time (UTC+05:30)
const eventTime = new Date('2026-11-24T20:00:00+05:30').getTime();
const ids = ['days','hours','minutes','seconds'];
const fields = ids.map(id => document.getElementById(id));
const previous = [null,null,null,null];
function updateCountdown(){
  const remaining = Math.max(0, eventTime - Date.now());
  const values = [
    Math.floor(remaining/86400000),
    Math.floor(remaining/3600000)%24,
    Math.floor(remaining/60000)%60,
    Math.floor(remaining/1000)%60
  ];
  fields.forEach((el,i)=>{
    const next = String(values[i]).padStart(2,'0');
    if(previous[i] !== next){
      el.textContent = next;
      if(previous[i] !== null){
        el.classList.remove('flip');
        const unit = el.closest('.unit');
        unit.classList.remove('tick');
        void el.offsetWidth;
        el.classList.add('flip');
        unit.classList.add('tick');
      }
      previous[i] = next;
    }
  });
  if(eventTime-Date.now()<=0){
    document.querySelector('h1 span').textContent='We’re Live!';
    document.querySelector('.sub').textContent='The ODA 7th Annual Event is happening now. Join us live!';
  }
}
updateCountdown();
setInterval(updateCountdown,250);
</script>
